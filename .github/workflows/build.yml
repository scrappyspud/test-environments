name: build

on:
  # PAJI's branches build on push (same steps, version check relaxed, no large data image); pushing a file under trigger/ starts a rebuild
  push:
    branches: ['paji/**']
    paths: ['.github/workflows/build.yml', 'trigger/**']
  workflow_dispatch:
    inputs:
      version_bypass:
        description: "relax version check"
        required: true
        type: boolean
        default: true
      app_pool:
        description: "Memory the game is told it has, hex (blank = leave the recipe's 0x280000000 = 10 GiB). Try 0x200000000 for 8 GiB. The recipe says it panics below ~7.9 GiB."
        required: false
        type: string
        default: ""
      upload_romfs:
        description: "include large data image"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  SRC_REPO: ${{ secrets.SRC_REPO }}
  SRC_COMMIT: ${{ secrets.SRC_COMMIT }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Log scrubber
        run: |
          mkdir -p "$HOME/bin"
          printf '%s\n' '#!/bin/sh' "exec sed -E 's/[Pp][Oo][Kk][Oo][Pp][Ii][Aa]/app/g; s/[Pp][Oo][Kk][EeÉé][Mm][Oo][Nn]/app/g; s/0[0-9A-Fa-f]{15}/TID/g; s/[Ff]ractals/x/g'" > "$HOME/bin/scrub"
          chmod +x "$HOME/bin/scrub"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Machine info
        run: |
          sw_vers
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true
          df -h / | tail -1
          sysctl -n hw.memsize | awk '{printf "RAM: %.0f GB\n", $1/1073741824}'

      - name: Fetch tools
        run: |
          set -euo pipefail
          git clone -q "https://github.com/${SRC_REPO}.git" "$RUNNER_TEMP/pn" 2>&1 | sed 's/.*/(clone output hidden)/' | head -1
          git -C "$RUNNER_TEMP/pn" checkout -q "$SRC_COMMIT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install tools
        run: |
          set -euo pipefail
          brew install xcodegen zstd glslang unar sevenzip
          python -m pip install --upgrade pip
          python -m pip install "capstone>=5,<6" lz4 fonttools gdown
          xcodebuild -downloadComponent MetalToolchain || echo "::warning::Metal toolchain download skipped or failed"
          xcodebuild -downloadPlatform iOS || echo "::warning::iOS platform download skipped or failed"

      - name: Download and unpack your dump
        env:
          DUMP_URL: ${{ secrets.DUMP_URL }}
        run: |
          set -euo pipefail
          [ -n "${DUMP_URL:-}" ] || { echo "::error::Add the DUMP_URL secret"; exit 1; }
          W="$RUNNER_TEMP/work"; mkdir -p "$W/dl" "$W/dump"
          ID="$(python - "$DUMP_URL" <<'PY'
          import re, sys
          from urllib.parse import urlparse, parse_qs
          u = sys.argv[1].strip(); p = urlparse(u); q = parse_qs(p.query); fid = None
          if "drive.google.com" in p.netloc:
              m = re.search(r"/file/d/([^/]+)", p.path)
              fid = m.group(1) if m else (q.get("id") or [None])[0]
          if not fid and re.fullmatch(r"[-A-Za-z0-9_]{20,}", u): fid = u
          if not fid: raise SystemExit("Could not read a Google Drive file ID from DUMP_URL")
          print(fid)
          PY
          )"
          gdown "$ID" -O "$W/dl/dump.archive"
          test -s "$W/dl/dump.archive"
          unar -q -o "$W/dump" "$W/dl/dump.archive"
          rm -rf "$W/dl"
          # locate <root>/updates/<version>/exefs/main
          MAIN="$(find "$W/dump" -maxdepth 6 -path '*/updates/*/exefs/main' -print -quit)"
          [ -n "$MAIN" ] || { echo "::error::No updates/<version>/exefs/main found in the archive"; exit 1; }
          ROOT="$(cd "$(dirname "$MAIN")/../../.." && pwd)"
          echo "DUMP_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Dump unpacked. Update folders found:"; ls "$ROOT/updates"
          df -h / | tail -1

      - name: Accept a newer game update (experimental)
        if: ${{ inputs.version_bypass || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, re
          pn = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pn"
          root = pathlib.Path(os.environ["DUMP_ROOT"])
          mains = sorted(root.glob("updates/*/exefs/main"))
          m = mains[-1]                       # the newest update in the dump
          ver = m.parent.parent.name
          assert ver.isdigit(), f"unexpected update folder name {ver}"
          bid = m.read_bytes()[0x40:0x50].hex()   # NSO build ID, first 16 bytes
          print(f"dump update {ver}, main build ID {bid}")
          tsv = next((pn / "profile").glob("*/game.tsv"))
          t = tsv.read_text()
          old_main = re.search(r"main=([0-9a-f]{32})", t).group(1)
          t = t.replace(old_main, bid).replace("327680", ver)
          tsv.write_text(t)
          nx = pn / "nxs2.py"
          s = nx.read_text()
          s2 = re.sub(r"^VERSION = \d+", f"VERSION = {ver}", s, flags=re.M)
          assert s2 != s or f"VERSION = {ver}" in s
          nx.write_text(s2)
          print(f"recipe now accepts main {bid} (was {old_main}), update {ver}")
          PY

      - name: setup + doctor
        working-directory: ${{ runner.temp }}/pn
        run: |
          python nxs2.py setup 2>&1 | scrub | tail -15
          python nxs2.py doctor 2>&1 | scrub || true

      - name: Compatibility fix for the runner SDK
        run: |
          set -euo pipefail
          F="$RUNNER_TEMP/pn/nxnative/dm/ios/Sources/DmGamepad.m"
          python - "$F" <<'PY2'
          import sys
          p=sys.argv[1]; s=open(p).read()
          old='    if (@available(iOS 27.0, *)) { g_motion.deviceMotionBody = body;'
          assert old in s, "line not found"
          new='#if defined(__IPHONE_27_0)\n'+old
          i=s.index(old); j=s.index('\n', i)
          s=s[:i]+new+s[i+len(old):j]+'\n#endif'+s[j:]
          open(p,'w').write(s); print("patched")
          PY2

      - name: Let the memory accountant start from env.txt on iOS
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/pn/nxnative" <<'PY4'
          import sys, pathlib
          nx = pathlib.Path(sys.argv[1])
          m = nx / "dm/host/memstat.m"; s = m.read_text()
          old = '__attribute__((constructor)) static void memstat_start(void) {\n    const char *p = getenv("DM_MEMSTAT");\n    if (!p || !*p) return;\n'
          new = ('static int g_memstat_on;\n'
                 '__attribute__((constructor)) static void memstat_start(void) {\n    const char *p = getenv("DM_MEMSTAT");\n    if (!p || !*p || g_memstat_on) return;\n    g_memstat_on = 1;\n')
          assert old in s, "memstat start not found"
          s = s.replace(old, new) + '\n// iOS: the constructor runs before Documents/env.txt is read; main.m calls this once the env file is applied\nvoid dm_memstat_late(void) { memstat_start(); }\n'
          m.write_text(s)
          mm = nx / "dm/ios/Sources/main.m"; t = mm.read_text()
          hook = '    front_hud_env();'
          assert t.count(hook) == 1, "hook not unique"
          t = t.replace(hook, '    { extern void dm_memstat_late(void); dm_memstat_late(); }   // DM_MEMSTAT from env.txt\n' + hook)
          mm.write_text(t); print("memstat late start patched")
          PY4

      - name: Pool scan diagnostic (DM_POOL_SCAN, read-only)
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/pn/nxnative" <<'PY6'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]) / "dm/gfx/nvn/nvn_mtl.m"; s = p.read_text()
          anchor = "void mtl_mem_stat(unsigned long long frame, unsigned long long rss_mb) {\n"
          assert s.count(anchor) == 1, "mtl_mem_stat"
          scan = r'''// DM_POOL_SCAN=1 (iPad port diagnostic, read-only): for every memory pool of 1 GB or more that is already resident (wired, so every page is present and reading
          // faults nothing in), count the 16 KB pages holding any nonzero byte, per 128 MB, and log the map with the memory readout. Pools not yet resident are skipped,
          // because reading their untouched pages would allocate them. Answers how much of a large pool the game has written, without changing what the GPU sees
          static void pool_scan(void) {
              static int on = -1; if (on < 0) { const char *e = getenv("DM_POOL_SCAN"); on = e && atoi(e) > 0; }
              if (!on) return;
              pthread_mutex_lock(&g_mu);
              for (int i = 0; i < g_npool; i++) {
                  uintptr_t lo = g_pools[i].lo, hi = g_pools[i].hi;
                  if (hi - lo < (1ull << 30) || !g_pools[i].res) continue;
                  const uintptr_t PG = 16384, BK = 128u << 20;
                  unsigned nb = (unsigned)((hi - lo + BK - 1) / BK); if (nb > 64) nb = 64;
                  uint64_t nz[64] = {0}, tot[64] = {0}, nzall = 0;
                  for (vm_address_t r = lo; r < hi; ) {
                      vm_address_t ra = r; vm_size_t rs = 0; vm_region_basic_info_data_64_t vi; mach_msg_type_number_t cnt = VM_REGION_BASIC_INFO_COUNT_64; mach_port_t obj = MACH_PORT_NULL;
                      if (vm_region_64(mach_task_self(), &ra, &rs, VM_REGION_BASIC_INFO_64, (vm_region_info_t)&vi, &cnt, &obj) != KERN_SUCCESS || !rs) break;
                      uintptr_t s0 = ra > r ? ra : r, s1 = ra + rs < hi ? ra + rs : hi;
                      if (s0 >= hi) break;
                      if (vi.protection & VM_PROT_READ)
                          for (uintptr_t q = (s0 + PG - 1) & ~(PG - 1); q + PG <= s1; q += PG) {
                              const uint64_t *w = (const uint64_t *)q; int z = 1;
                              for (size_t k = 0; k < PG / 8; k++) if (w[k]) { z = 0; break; }
                              unsigned b = (unsigned)((q - lo) / BK); if (b >= nb) b = nb - 1;
                              tot[b] += PG; if (!z) { nz[b] += PG; nzall += PG; }
                          }
                      r = ra + rs;
                  }
                  char map[65]; for (unsigned b = 0; b < nb; b++) map[b] = !tot[b] ? '-' : !nz[b] ? '.' : nz[b] == tot[b] ? '#' : (char)('0' + nz[b] * 10 / tot[b]); map[nb] = 0;
                  MLOG("pool scan %#lx+%#lx (resident): pages holding data %llu MB of %llu MB; per 128 MB, tenths full (. empty, # all, - unreadable): %s",
                       (unsigned long)lo, (unsigned long)(hi - lo), (unsigned long long)(nzall >> 20), (unsigned long long)((hi - lo) >> 20), map);
              }
              pthread_mutex_unlock(&g_mu);
          }
          '''
          s = s.replace(anchor, scan + anchor + "    pool_scan();\n")
          p.write_text(s); print("pool scan patched")
          PY6

      - name: Pool wrap cap (DM_POOL_WRAP_MB)
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/pn/nxnative" <<'PY7'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]) / "dm/gfx/nvn/nvn_mtl.m"; s = p.read_text()
          a = "void mtl_pool_add(const void *mem, uint64_t size) {\n    mtl_init(); g_reg_gen++;\n"
          assert s.count(a) == 1, "mtl_pool_add head"
          s = s.replace(a, a + r'''    // DM_POOL_WRAP_MB=<N> (iPad port patch): a pool of 1 GB or more larger than N MB is wrapped for the GPU only over its first N MB, as one buffer starting where the pool
              // starts (the same GPU base, so addresses into the front stay valid). Making the buffer resident wires every page of it; on an 8 GB iPad Pokopia's 3.5 GB pool was
              // wired whole a moment into the boot with 4 MB written, and its last ~550 MB were still never written a minute in. A lookup past N MB finds no pool, as for any
              // address outside the game's pools (logged, the access skipped). Unset or 0: the whole pool, as before
              { static long cap = -1; if (cap < 0) { const char *e = getenv("DM_POOL_WRAP_MB"); cap = e ? atol(e) : 0; if (cap < 0) cap = 0; }
                if (cap && size >= (1ull << 30) && size > ((uint64_t)cap << 20)) {
                    MLOG("memory pool %p+%#llx: only its first %ld MB wrapped for the GPU, the last %llu MB left unwired (DM_POOL_WRAP_MB)", mem, (unsigned long long)size, cap,
                         (unsigned long long)((size - ((uint64_t)cap << 20)) >> 20));
                    size = (uint64_t)cap << 20; } }
          ''')
          p.write_text(s); print("pool wrap cap patched")
          PY7

      - name: Half-resolution textures (DM_TEX_HALF)
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/pn/nxnative" <<'PY8'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]) / "dm/gfx/nvn/nvn_mtl.m"; s = p.read_text()
          def rep(old, new, count=1):
              global s
              n = s.count(old)
              assert n == count, f"anchor found {n}x (want {count}): {old[:70]!r}"
              s = s.replace(old, new)

          # 1. helpers, ahead of tex_desc
          rep("static MTLTextureDescriptor *tex_desc(const tex_t *t, int packaged) {\n", r'''// DM_TEX_HALF=<N> (iPad port patch): a block-compressed 2D texture of N x N or more with a mip chain gets a host texture without its level 0, half its size (a "medium texture
          // quality"): the game's level L lives in the host's level L - 1, which has exactly that level's size, so every write and read of level L >= 1 lands unchanged one level down and a
          // write of level 0 is skipped. Whether a host texture is one is read from its own size against the game's (lod_of), never stored, so no path that remakes a texture can lose it.
          // The game's own copy in its memory pool is not changed. Render targets, images, linear, sparse and multisample textures are never halved. Unset or 0: off
          static int lod_min(void) { static int v = -1; if (v < 0) { const char *e = getenv("DM_TEX_HALF"); v = e ? atoi(e) : 0; if (v < 0) v = 0; } return v; }
          static int lod_want(const tex_t *t) {
              int m = lod_min();
              if (!m || !t || t->d.target != 1 || t->d.levels < 2 || t->d.samples > 1 || !fmt_compressed(t->d.format)) return 0;
              if (t->d.width < (uint32_t)m || t->d.height < (uint32_t)m) return 0;
              if (t->d.flags & (NVN_TEXTURE_FLAGS_IMAGE | NVN_TEXTURE_FLAGS_COMPRESSIBLE | NVN_TEXTURE_FLAGS_LINEAR | NVN_TEXTURE_FLAGS_LINEAR_RENDER_TARGET | NVN_TEXTURE_FLAGS_SPARSE)) return 0;
              if (t->pool && (t->pool->flags & NVN_MEMORY_POOL_FLAGS_VIRTUAL)) return 0;
              return 1;
          }
          static inline unsigned lod_of(const tex_t *t, id<MTLTexture> m) {   // 1 when m is the halved host texture of t
              return t && m && !m.parentTexture && m.textureType == MTLTextureType2D && t->d.target == 1 && t->d.width > 1 && m.width < t->d.width ? 1u : 0u;
          }
          static inline unsigned lod_lv(const tex_t *t, id<MTLTexture> m, unsigned level) {   // the game's level → the host's; 0xFFFFFFFFu: level 0 of a halved texture (skipped)
              return lod_of(t, m) ? (level ? level - 1 : 0xFFFFFFFFu) : level;
          }
          static MTLTextureDescriptor *tex_desc(const tex_t *t, int packaged) {
          ''')
          # 2. halve the descriptor
          rep("    if (d.pixelFormat == MTLPixelFormatDepth32Float_Stencil8) d.usage |= MTLTextureUsagePixelFormatView;\n    return d;\n}\n",
              "    if (d.pixelFormat == MTLPixelFormatDepth32Float_Stencil8) d.usage |= MTLTextureUsagePixelFormatView;\n"
              "    if (lod_want(t) && d.mipmapLevelCount > 1) {\n"
              "        static uint64_t n; if (n++ < 4) MLOG(\"half-resolution texture (DM_TEX_HALF): ser=%llu %ux%u, %lu levels → %lux%lu, %lu levels\", (unsigned long long)t->serial, t->d.width, t->d.height,\n"
              "                                         (unsigned long)d.mipmapLevelCount, (unsigned long)MAX(d.width >> 1, 1u), (unsigned long)MAX(d.height >> 1, 1u), (unsigned long)d.mipmapLevelCount - 1);\n"
              "        d.width = MAX(d.width >> 1, 1u); d.height = MAX(d.height >> 1, 1u); d.mipmapLevelCount -= 1;\n"
              "    }\n    return d;\n}\n")
          # 3. uploads from the game's storage (first upload, re-uploads, initial fill): start one level in, write one level down
          rep("    if (direct) d.usage |= MTLTextureUsageShaderWrite | MTLTextureUsagePixelFormatView;\n",
              "    if (lod_want(t)) direct = 0;   // the direct deswizzle writes level by level into a view of all levels\n"
              "    if (direct) d.usage |= MTLTextureUsageShaderWrite | MTLTextureUsagePixelFormatView;\n")
          rep("    res_add(mt);   // Both first upload and re-upload register residency here",
              "    unsigned lodd = lod_of(t, mt);   // DM_TEX_HALF: the game's level l goes to the host's l - lodd\n"
              "    res_add(mt);   // Both first upload and re-upload register residency here")
          rep("        for (unsigned l = 0; enc_ok && l < d.mipmapLevelCount; l++) {\n",
              "        for (unsigned l = lodd; enc_ok && l < d.mipmapLevelCount + lodd; l++) {\n")
          rep("up_blit_add(stg, stg_off + off, pitch, pitch * rows, MTLSizeMake(w, h, z), mt, y, l);",
              "up_blit_add(stg, stg_off + off, pitch, pitch * rows, MTLSizeMake(w, h, z), mt, y, l - lodd);")
          cpu_head = ("    for (unsigned l = 0; l < d.mipmapLevelCount; l++) {\n"
                      "        uint32_t w = MAX(t->d.width >> l, 1u), h = MAX(t->d.height >> l, 1u), z = t->d.target == 2 ? MAX(t->d.depth >> l, 1u) : 1;\n"
                      "        size_t pitch = (size_t)((w + bw - 1) / bw) * bpb, rows = (h + bh - 1) / bh;\n"
                      "        for (unsigned y = 0; y < layers; y++) {\n"
                      "            if (nvn_deswizzle(")
          rep(cpu_head, cpu_head.replace("for (unsigned l = 0; l < d.mipmapLevelCount; l++)", "for (unsigned l = lodd; l < d.mipmapLevelCount + lodd; l++)"))
          rep("            up_blit_add(stg, off, pitch, pitch * rows, MTLSizeMake(w, h, z), mt, y, l);",
              "            up_blit_add(stg, off, pitch, pitch * rows, MTLSizeMake(w, h, z), mt, y, l - lodd);")
          # 4. the game's copies and readbacks: its level → the host's; level 0 of a halved texture skipped
          rep("static int tex_level_ok(id<MTLTexture> t, NSUInteger level, const char *what) {\n",
              "static int tex_level_ok(id<MTLTexture> t, NSUInteger level, const char *what) {\n"
              "    if (level == 0xFFFFFFFFu) return 0;   // level 0 of a DM_TEX_HALF texture: it has none\n")
          rep('if (!tex_level_ok(t, level, "texture-to-buffer copy")) return;',
              'if (!tex_level_ok(t, level = lod_lv(c->tex, t, level), "texture-to-buffer copy")) return;')
          rep('if (!mt || !tex_level_ok(mt, level, "CPU readback")) {',
              'if (!mt || !tex_level_ok(mt, level = lod_lv(t, mt, level), "CPU readback")) {')
          rep('if (!tex_level_ok(t, level, "buffer-to-texture copy")) return;',
              'if (!tex_level_ok(t, level = lod_lv(c->tex, t, level), "buffer-to-texture copy")) return;')
          rep("    int rb = !is3d && tex_storage_dst(c->tex);",
              "    int rb = !is3d && !lod_of(c->tex, t) && tex_storage_dst(c->tex);   // DM_TEX_HALF: no mirror of a halved texture's levels into the game's storage")
          rep('if (!tex_level_ok(s, sl, "texture copy source") || !tex_level_ok(d, dl, "texture copy destination")) return;',
              'if (!tex_level_ok(s, sl = lod_lv(c->src, s, sl), "texture copy source") || !tex_level_ok(d, dl = lod_lv(c->dst, d, dl), "texture copy destination")) return;')
          # 5. sampling views: the game's level range → the host's
          rep("        NSUInteger l0 = r.v.set_levels ? r.v.base_level : 0, nl = r.v.set_levels && r.v.nlevels ? r.v.nlevels : base.mipmapLevelCount - l0;\n",
              "        NSUInteger l0 = r.v.set_levels ? r.v.base_level : 0, nl = r.v.set_levels && r.v.nlevels ? r.v.nlevels : base.mipmapLevelCount - l0;\n"
              "        if (lod_of(&rp->t, base)) {   // DM_TEX_HALF: levels l0.. of the game are the host's l0 - 1..; a view from level 0 starts at the host's 0 with one level fewer\n"
              "            if (l0) { l0--; if (!(r.v.set_levels && r.v.nlevels)) nl = base.mipmapLevelCount - l0; }\n"
              "            else if (r.v.set_levels && r.v.nlevels > 1) nl--;\n"
              "        }\n")
          p.write_text(s); print("DM_TEX_HALF patched")
          PY8

      - name: Render target store report (DM_STORE_REPORT, read-only)
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/pn/nxnative" <<'PY9'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]) / "dm/gfx/nvn/nvn_mtl.m"; s = p.read_text()
          def once(a):
              n = s.count(a); assert n == 1, f"anchor found {n}x: {a[:60]!r}"
          # 1. the tally and its report, right after the attachment record type
          a = "const char *wkey; int wslot; } sd_att;"; once(a)
          i = s.index(a); j = s.index("\n", i) + 1
          code = r'''// DM_STORE_REPORT=1 (iPad port diagnostic, read-only): every render-target write-back decision at a pass end is tallied by its outcome and reason, and with the memory readout
          // (every 300 frames) one line gives the per-frame megabytes, then the eight textures that keep the most stored bytes. "Memoryless" counts skipped stores of attachments the pass did
          // not load either (cleared or not read at its start): those need no memory outside the pass. Nothing it does changes what is rendered
          static int g_srep = -1;
          static uint64_t g_sr_b[8], g_sr_db, g_sr_mlb; static unsigned long long g_sr_frame0;
          typedef struct { uint64_t ser, bytes, n; uint8_t why, depth; } sr_top;
          static sr_top g_sr_top[64]; static int g_sr_ntop;
          static int srep_on(void) { if (g_srep < 0) { const char *e = getenv("DM_STORE_REPORT"); g_srep = e && atoi(e) > 0; } return g_srep; }
          static void store_note(const sd_att *t, int dead) {
              if (!srep_on()) return;
              if (dead) { g_sr_db += t->bytes; if (!t->load) g_sr_mlb += t->bytes; return; }
              int w = t->why < 8 ? t->why : 7; g_sr_b[w] += t->bytes;
              int k; for (k = 0; k < g_sr_ntop; k++) if (g_sr_top[k].ser == t->ser && g_sr_top[k].depth == t->depth) break;
              if (k == g_sr_ntop) {
                  if (g_sr_ntop < 64) g_sr_ntop++;
                  else { int m = 0; for (int q = 1; q < 64; q++) if (g_sr_top[q].bytes < g_sr_top[m].bytes) m = q; k = m; }
                  g_sr_top[k] = (sr_top){t->ser, 0, 0, (uint8_t)w, t->depth};
              }
              g_sr_top[k].bytes += t->bytes; g_sr_top[k].n++; g_sr_top[k].why = (uint8_t)w;
          }
          static void store_report(unsigned long long frame) {
              if (!srep_on()) return;
              unsigned long long nf = frame > g_sr_frame0 ? frame - g_sr_frame0 : 1; g_sr_frame0 = frame;
              uint64_t kept = 0; for (int w = 0; w < 8; w++) kept += g_sr_b[w];
          #define SRMB(x) ((unsigned long long)((x) / nf) >> 20)
              MLOG("store report over %llu frames, per frame: stored %llu MB, skipped %llu MB (%llu MB of it memoryless-capable); stores kept because: read as a texture %llu MB, drawn into again %llu MB, copied %llu MB, "
                   "texture clear %llu MB, not seen again in the submission %llu MB, no lookahead %llu MB", nf, SRMB(kept), SRMB(g_sr_db), SRMB(g_sr_mlb), SRMB(g_sr_b[1]), SRMB(g_sr_b[2]), SRMB(g_sr_b[3]),
                   SRMB(g_sr_b[4]), SRMB(g_sr_b[5]), SRMB(g_sr_b[6] + g_sr_b[0] + g_sr_b[7]));
              static const char *wn[8] = {"other", "read as a texture", "drawn into again", "copied", "texture clear", "not seen again in the submission", "no lookahead", "other"};
              for (int r = 0; r < 8; r++) {
                  int m = -1; for (int q = 0; q < g_sr_ntop; q++) if (g_sr_top[q].bytes && (m < 0 || g_sr_top[q].bytes > g_sr_top[m].bytes)) m = q;
                  if (m < 0) break;
                  MLOG("store report top %d: texture ser=%llu %s, %llu MB per frame in %llu stores per frame, kept: %s", r + 1, (unsigned long long)g_sr_top[m].ser,
                       g_sr_top[m].depth == 1 ? "depth" : g_sr_top[m].depth == 2 ? "stencil" : "color", SRMB(g_sr_top[m].bytes), (unsigned long long)(g_sr_top[m].n / nf), wn[g_sr_top[m].why & 7]);
                  g_sr_top[m].bytes = 0;
              }
          #undef SRMB
              memset(g_sr_b, 0, sizeof g_sr_b); g_sr_db = g_sr_mlb = 0; g_sr_ntop = 0;
          }
          '''
          s = s[:j] + code + s[j:]
          # 2. tally each decision once its reason is final
          a = "        if (!t->state) t->why = 5;\n"; once(a)
          s = s.replace(a, a + "        store_note(t, dead);\n")
          # 3. report with the memory readout
          a = "void mtl_mem_stat(unsigned long long frame, unsigned long long rss_mb) {\n"; once(a)
          s = s.replace(a, "static void store_report(unsigned long long frame);\n" + a + "    store_report(frame);\n")
          p.write_text(s); print("store report patched")
          PY9

      - name: Render pass break report (DM_STORE_REPORT, read-only)
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/pn/nxnative" <<'PYA'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]) / "dm/gfx/nvn/nvn_mtl.m"; s = p.read_text()
          def rep(a, b):
              global s
              n = s.count(a); assert n == 1, f"anchor found {n}x: {a[:60]!r}"
              s = s.replace(a, b)
          # DM_STORE_REPORT pass breaks (iPad port diagnostic, read-only): every place that ends a render pass is tallied by its source line, and when the next pass attaches the same
          # targets again (a store and a reload a merged pass would not need) the line that ended the previous one gets the blame. Reported with the store report
          rep("static void rp_end(void);\n",
              "static void rp_end_(void);\n"
              "static int g_pb_line, g_pb_end_line; static uint32_t g_pb_end[16384], g_pb_same[16384]; static uintptr_t g_pb_prev_key;   // DM_STORE_REPORT: pass ends by source line (see store_report)\n"
              "#define rp_end() (g_pb_line = __LINE__, rp_end_())\n")
          rep("static void rp_end(void) { if (g_enc) { AP_B;",
              "static void rp_end_(void) { if (g_enc) { AP_B; g_pb_end_line = g_pb_line; if (g_pb_line > 0 && g_pb_line < 16384) g_pb_end[g_pb_line]++;")
          rep("    g_enc = enc_r_begin_pass(pd);\n",
              "    { id<MTLTexture> c0 = pd.colorAttachments[0].texture, dt = pd.depthAttachment.texture;   // DM_STORE_REPORT: the same targets as the pass just ended?\n"
              "      uintptr_t key = (uintptr_t)(__bridge void *)(c0.parentTexture ?: c0) * 31u ^ (uintptr_t)(__bridge void *)(dt.parentTexture ?: dt) ^ (uintptr_t)pd.colorAttachments[0].level << 4 ^ (uintptr_t)pd.colorAttachments[0].slice << 8;\n"
              "      if (key && key == g_pb_prev_key && g_pb_end_line > 0 && g_pb_end_line < 16384) g_pb_same[g_pb_end_line]++;\n"
              "      g_pb_prev_key = key; }\n"
              "    g_enc = enc_r_begin_pass(pd);\n")
          rep("    memset(g_sr_b, 0, sizeof g_sr_b); g_sr_db = g_sr_mlb = 0; g_sr_ntop = 0;\n",
              "    { uint64_t ends = 0, same = 0; for (int l = 0; l < 16384; l++) { ends += g_pb_end[l]; same += g_pb_same[l]; }\n"
              "      MLOG(\"store report pass ends per frame: %llu, %llu of them followed by a pass on the same targets (a store and reload a merge would save)\", (unsigned long long)(ends / nf), (unsigned long long)(same / nf));\n"
              "      for (int r = 0; r < 12; r++) { int m = -1; for (int l = 1; l < 16384; l++) if (g_pb_end[l] && (m < 0 || g_pb_same[l] > g_pb_same[m] || (g_pb_same[l] == g_pb_same[m] && g_pb_end[l] > g_pb_end[m]))) m = l;\n"
              "          if (m < 0) break;\n"
              "          MLOG(\"store report pass end at nvn_mtl.m line %d: %llu per frame, %llu of them then reopened the same targets\", m, (unsigned long long)(g_pb_end[m] / nf), (unsigned long long)(g_pb_same[m] / nf));\n"
              "          g_pb_end[m] = 0; g_pb_same[m] = 0; }\n"
              "      memset(g_pb_end, 0, sizeof g_pb_end); memset(g_pb_same, 0, sizeof g_pb_same); }\n"
              "    memset(g_sr_b, 0, sizeof g_sr_b); g_sr_db = g_sr_mlb = 0; g_sr_ntop = 0;\n")
          p.write_text(s); print("pass break report patched")
          PYA

      - name: Fetch recorded data (optional)
        env:
          REC_URL: ${{ secrets.REC_URL }}
        run: |
          set -euo pipefail
          echo "REC_DIR=" >> "$GITHUB_ENV"
          [ -n "${REC_URL:-}" ] || { echo "no recorded data configured"; exit 0; }
          W="$RUNNER_TEMP/rec"; mkdir -p "$W/dl" "$W/x"
          ID="$(python - "$REC_URL" <<'PY3'
          import re, sys
          from urllib.parse import urlparse, parse_qs
          u = sys.argv[1].strip(); p = urlparse(u); q = parse_qs(p.query); fid = None
          m = re.search(r"/file/d/([^/]+)", p.path)
          fid = m.group(1) if m else (q.get("id") or [None])[0]
          if not fid and re.fullmatch(r"[-A-Za-z0-9_]{20,}", u): fid = u
          if not fid: raise SystemExit("could not read an ID from REC_URL")
          print(fid)
          PY3
          )"
          gdown "$ID" -O "$W/dl/rec.archive"
          unar -q -o "$W/x" "$W/dl/rec.archive"
          D="$(find "$W/x" -name '*.ctl' -print -quit | xargs -r dirname)"
          [ -n "$D" ] || { echo "::error::no recorded files found in the archive"; exit 1; }
          echo "recorded files: $(ls "$D"/*.ctl | wc -l)"
          echo "REC_DIR=$D" >> "$GITHUB_ENV"

      - name: Set the memory the game is told it has
        if: ${{ inputs.app_pool }}
        env:
          APP_POOL: ${{ inputs.app_pool }}
        run: |
          set -euo pipefail
          python - <<'PY2'
          import os, pathlib, re
          want = os.environ["APP_POOL"].strip().lower()
          if not re.fullmatch(r"0x[0-9a-f]{4,12}", want):
              raise SystemExit(f"app_pool must look like 0x200000000, got {want!r}")
          val = int(want, 16)
          if not (0x100000000 <= val <= 0x300000000):
              raise SystemExit("app_pool outside the sane 4 GiB - 12 GiB range")
          tsv = next((pathlib.Path(os.environ["RUNNER_TEMP"]) / "pn" / "profile").glob("*/game.tsv"))
          t = tsv.read_text()
          m = re.search(r"^app_pool\t(0x[0-9A-Fa-f]+)$", t, re.M)
          if not m:
              raise SystemExit("no app_pool line in the profile")
          t = t[:m.start(1)] + want + t[m.end(1):]
          tsv.write_text(t)
          print(f"app_pool {m.group(1)} -> {want}  ({val / 2**30:.2f} GiB)")
          PY2

      - name: Build (this takes about an hour)
        working-directory: ${{ runner.temp }}/pn
        run: |
          set +e
          EXTRA=""; [ -n "${REC_DIR:-}" ] && EXTRA="--dumps $REC_DIR"
          python nxs2.py build "$DUMP_ROOT" --ipa -j 3 $EXTRA > "$RUNNER_TEMP/build.log" 2>&1
          STATUS=$?
          echo "build exit code: $STATUS"
          echo "--- last lines of the build output ---"
          tail -n 40 "$RUNNER_TEMP/build.log" | scrub
          echo "BUILD_STATUS=$STATUS" >> "$GITHUB_ENV"
          exit 0

      - name: Collect and encrypt results
        if: always()
        env:
          PW: ${{ secrets.ARTIFACT_PASSWORD }}
          UPLOAD_ROMFS: ${{ inputs.upload_romfs }}
        run: |
          set -uo pipefail
          [ -n "${PW:-}" ] || { echo "::error::Add the ARTIFACT_PASSWORD secret (refusing to upload unencrypted)"; exit 1; }
          OUT="$(dirname "$DUMP_ROOT")"; B="${DUMP_ROOT}_native"
          [ -d "$B" ] || B="$(find "$RUNNER_TEMP/work" -maxdepth 2 -name '*_native' -type d -print -quit)"
          S="$RUNNER_TEMP/stage"; mkdir -p "$S"
          cp "$RUNNER_TEMP/build.log" "$S/" 2>/dev/null || true
          if [ -n "${B:-}" ] && [ -d "$B" ]; then
            echo "Build folder contents (top level):"; ls "$B"
            [ -d "$B/out" ]  && cp -R "$B/out"  "$S/out"
            [ -d "$B/logs" ] && cp -R "$B/logs" "$S/logs"
            find "$B/ipa" -name build.log -size -20M -exec cp {} "$S/app-build.log" \; 2>/dev/null
            if [ "$UPLOAD_ROMFS" = "true" ] && [ -f "$B/extract/RomFS.img" ]; then cp "$B/extract/RomFS.img" "$S/"; fi
          fi
          cd "$S" && ls -la
          7zz a -p"$PW" -mhe=on -mx=1 "$RUNNER_TEMP/results.7z" . >/dev/null
          ls -lh "$RUNNER_TEMP/results.7z"

      - name: Upload (encrypted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-encrypted
          path: ${{ runner.temp }}/results.7z
          if-no-files-found: error
          retention-days: 2

      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/work" "$RUNNER_TEMP/stage" "$RUNNER_TEMP/build.log"
